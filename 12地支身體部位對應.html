<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>十二地支 × 人體部位對照</title>
<style>
  body {
    font-family: "Noto Serif TC", "PMingLiU", serif;
    background: #faf7f2;
    color: #2b2b2b;
    padding: 28px;
    line-height: 1.6;
  }
  h1 {
    font-size: 1.45rem;
    letter-spacing: .1em;
    border-bottom: 2px solid #8b6f47;
    padding-bottom: 10px;
    margin-bottom: 4px;
  }
  .sub {
    font-size: .85rem;
    color: #7a6b55;
    margin-bottom: 18px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 720px;
    background: #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.08);
  }
  thead th {
    background: #8b6f47;
    color: #fff;
    font-weight: 600;
    letter-spacing: .12em;
    padding: 11px 14px;
    font-size: .95rem;
  }
  td {
    border: 1px solid #ddd3c4;
    padding: 10px 14px;
    font-size: .95rem;
    vertical-align: middle;
  }
  td:nth-child(1) {
    text-align: center;
    font-size: 1.3rem;
    color: #7a3b2e;
    width: 68px;
    font-weight: 600;
  }
  td:nth-child(2) {
    color: #6b5b45;
    width: 130px;
  }
  tbody tr:nth-child(even) { background: #f5f0e6; }
  tbody tr:hover { background: #efe6d6; }
  footer {
    margin-top: 18px;
    max-width: 720px;
    font-size: .8rem;
    color: #8a7f70;
    line-height: 1.8;
    border-top: 1px dashed #d8cfc0;
    padding-top: 12px;
  }
</style>
</head>
<body>

<h1>十二地支 × 人體部位對照</h1>
<div class="sub">臟腑取象 · 身形取象 · 兩欄並列</div>

<table>
  <thead>
    <tr>
      <th>地支</th>
      <th>對應臟腑</th>
      <th>對應身形／部位</th>
    </tr>
  </thead>
  <tbody>
    <tr><td>子</td><td>腎、膀胱</td><td>下焦、耳、生殖器、足底</td></tr>
    <tr><td>丑</td><td>脾、胃</td><td>腹部、腰、足脛</td></tr>
    <tr><td>寅</td><td>膽</td><td>坐骨、大腿、下肢關節</td></tr>
    <tr><td>卯</td><td>肝</td><td>脅肋、手指、目</td></tr>
    <tr><td>辰</td><td>胃、脾</td><td>胸膈、肩、皮膚</td></tr>
    <tr><td>巳</td><td>心、小腸</td><td>面、咽喉、上臂</td></tr>
    <tr><td>午</td><td>心</td><td>背、頭頂、血脈、目</td></tr>
    <tr><td>未</td><td>脾、小腸</td><td>腹中、脊、頭面</td></tr>
    <tr><td>申</td><td>肺、大腸</td><td>肩背、骨節、鼻</td></tr>
    <tr><td>酉</td><td>肺、大腸</td><td>口、齒、氣管、腰</td></tr>
    <tr><td>戌</td><td>胃、心包</td><td>腹壁、足膝、腿</td></tr>
    <tr><td>亥</td><td>腎、三焦</td><td>頭、腦、足、精室</td></tr>
  </tbody>
</table>

<footer>
  身形欄採「子在下焦、亥在頭腦」之通行排法；另有以「午為頭、子為足」的正序排法，此時身形欄整欄反轉即可。<br>
  臟腑欄各家略有出入（如辰戌丑未之脾胃分屬、亥之三焦或心包），本表採較通用者。
</footer>

</body>
</html>
